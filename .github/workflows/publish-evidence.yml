name: Publish evidence files
on:
  push:
    paths:
      - '.github/workflows/publish-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish source records from verified archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf evidence/Online_Resource_1.tar.xz --exclude=README.md --exclude=code/counterexamples.py
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          with open('extraction_ledger.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==15, f"Expected 15 assessed studies, got {len(rows)}"
          for path in ['claim_locations.json','assessed_source_manifest.json','reference_verification_ledger.json','counterexample_results.json','tables.json']:
              json.loads(Path(path).read_text())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extraction_ledger.csv claim_locations.json assessed_source_manifest.json descriptive_appraisal.csv discovery_queries.csv reference_verification_ledger.json counterexample_results.json tables.json
          git commit -m "Expose supporting evidence files for review" || exit 0
          git push
